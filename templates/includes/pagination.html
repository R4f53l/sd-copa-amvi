{% load i18n %}
{% if is_paginated %}
  <nav aria-label="{% translate 'Pagination' %}">
    <ul class="pagination justify-content-center">
      {% if page_obj.has_previous %}
        <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">{% translate "Previous" %}</a></li>
      {% endif %}
      <li class="page-item disabled"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
      {% if page_obj.has_next %}
        <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">{% translate "Next" %}</a></li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
