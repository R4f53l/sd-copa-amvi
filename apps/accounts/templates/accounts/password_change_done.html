{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Password changed" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="alert alert-success shadow-sm" role="status">
      <h1 class="h4">{% translate "Password changed" %}</h1>
      <p class="mb-0">{% translate "Your password has been changed successfully." %}</p>
    </div>
    <a class="btn btn-outline-success" href="{% url 'matches:list' %}">{% translate "Back to matches" %}</a>
  </div>
</div>
{% endblock %}
