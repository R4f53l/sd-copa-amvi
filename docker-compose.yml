# Development services. The Django app runs on the host (see README).
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copa_amvi
      POSTGRES_PASSWORD: copa_amvi
      POSTGRES_DB: copa_amvi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copa_amvi -d copa_amvi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
